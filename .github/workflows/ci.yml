name: Verify
'on':
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    # Explicit bash enables pipefail: tee must not hide a failed test command.
    shell: bash
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      # A failure on one Node version must not cancel the other diagnostic run.
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Record runtime versions
        run: |
          mkdir -p qa/ci-core
          { node --version; npm --version; uname -srmo; } 2>&1 | tee qa/ci-core/environment.log
      - name: Repository, numerical and deterministic-build checks
        run: npm run verify 2>&1 | tee qa/ci-core/verify.log
      - name: Preserve core logs, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-node-${{ matrix.node }}-evidence
          path: qa/ci-core/
          if-no-files-found: warn
          retention-days: 14
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Record runtime versions
        run: |
          mkdir -p qa/ci
          { node --version; python --version; python -m pip --version; uname -srmo; } 2>&1 | tee qa/ci/environment.log
      - name: Check committed standalone build
        run: npm run build -- --check 2>&1 | tee qa/ci/build.log
      - name: Install pinned Python test tools
        run: |
          python -m pip install -r requirements-dev.txt 2>&1 | tee qa/ci/dependencies.log
          python -m pip check 2>&1 | tee qa/ci/pip-check.log
          python -m pip list --format=freeze > qa/ci/installed-packages.txt
      - name: Install the Chromium revision required by Playwright
        run: |
          python -m playwright --version 2>&1 | tee qa/ci/playwright-version.log
          python -m playwright install --with-deps chromium 2>&1 | tee qa/ci/browser-install.log
      - name: Check JSON programme schemas
        run: python tools/check_schema.py 2>&1 | tee qa/ci/schema.log
      - name: Native Pages entry-point checks
        # Serve the committed applications, not a README or a reconstructed DOM.
        run: python tests/browser/pages.py --output qa/ci/pages 2>&1 | tee qa/ci/pages.log
      - name: Native browser and rendering checks
        # Never substitute DOM mode or suppress a failure in a required check.
        run: python tests/browser/run.py --mode native --visual --output qa/ci 2>&1 | tee qa/ci/browser.log
      - name: Preserve actual results, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-native-evidence
          path: qa/ci/
          if-no-files-found: warn
          retention-days: 14
